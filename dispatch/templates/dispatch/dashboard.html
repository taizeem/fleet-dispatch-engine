<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo-Spatial Fleet Dispatch | Live Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background: #0f172a; color: #f8fafc; }
        #sidebar { width: 400px; background: #1e293b; padding: 24px; display: flex; flex-direction: column; gap: 14px; border-right: 1px solid #334155; z-index: 1000; overflow-y: auto; }
        #map { flex: 1; height: 100%; background: #0b1120; }
        h1 { font-size: 20px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .subtitle { font-size: 12px; color: #94a3b8; }
        .card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
        .card-title { font-size: 13px; font-weight: 600; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.5px; }
        label { font-size: 12px; color: #cbd5e1; }
        input { width: 100%; padding: 8px 12px; background: #1e293b; border: 1px solid #475569; border-radius: 6px; color: #fff; font-size: 13px; margin-top: 4px; }
        button { background: #0284c7; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; font-size: 14px; width: 100%; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .btn-green { background: #16a34a !important; }
        .btn-blue { background: #2563eb !important; }
        .btn-yellow { background: #ca8a04 !important; color: #000 !important; }
        .btn-red { background: #dc2626 !important; }
        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; width: fit-content; text-transform: uppercase; }
        .status-idle { background: #334155; color: #94a3b8; }
        .status-offered { background: #854d0e; color: #fef08a; }
        .status-accepted { background: #166534; color: #bbf7d0; }
        .status-arrived { background: #0891b2; color: #cffafe; }
        .status-in_progress { background: #1e40af; color: #bfdbfe; }
        .status-completed { background: #047857; color: #a7f3d0; }
        .route-info { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #38bdf8; background: #0284c720; padding: 8px 12px; border-radius: 6px; border: 1px solid #0284c740; }
        .log-box { background: #020617; border: 1px solid #1e293b; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 11px; height: 140px; overflow-y: auto; color: #a5f3fc; }
        .otp-display { font-size: 26px; font-weight: 800; letter-spacing: 4px; color: #facc15; text-align: center; background: #1e293b; border-radius: 6px; padding: 8px; border: 1px dashed #ca8a04; }
        .car-marker {
            background: #0284c7;
            border: 2px solid #ffffff;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 14px rgba(2, 132, 199, 0.9);
            transition: all 0.4s ease-out;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <div>
            <h1><span>⚡</span> Fleet Dispatch</h1>
            <p class="subtitle">OSRM Street-Network Routing & Real-Time Tracking</p>
        </div>

        <div class="card">
            <div class="card-title">1. Rider Controls</div>
            <div>
                <label>Rider ID</label>
                <input id="riderId" type="text" value="b2222222-2222-2222-2222-222222222222" />
            </div>
            <div>
                <label>Pickup Location (Lat, Lon)</label>
                <input id="pickupCoords" type="text" value="40.7580, -73.9855" />
            </div>
            <div>
                <label>Dropoff Location (Lat, Lon)</label>
                <input id="dropoffCoords" type="text" value="40.7660, -73.9760" />
            </div>
            <button id="btnRequest" onclick="requestRide()">Request Live Ride</button>
        </div>

        <div class="card">
            <div class="card-title">Trip Status & Road ETA</div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div id="statusBadge" class="status-badge status-idle">IDLE</div>
            </div>
            <div id="routeInfoBox" class="route-info" style="display: none;">
                <span id="routeDistance">0.0 km</span>
                <span id="routeDuration">0.0 mins ETA</span>
            </div>
            <div id="otpContainer" style="display: none;">
                <label>Rider Security OTP (Boarding Code)</label>
                <div id="otpValue" class="otp-display">----</div>
            </div>
            <div id="receiptContainer" style="display: none;">
                <label>Trip Receipt</label>
                <div style="font-size: 15px; font-weight: 700; color: #34d399;" id="receiptDetails"></div>
            </div>
        </div>

        <div class="card" id="driverActionsCard" style="display: none; border-color: #0284c7;">
            <div class="card-title" style="color: #38bdf8;">2. Driver Actions (Simulator)</div>
            <button id="btnAccept" class="btn-green" onclick="driverAccept()">Accept Ride Offer</button>
            <button id="btnArrive" class="btn-blue" style="display: none;" onclick="driverArrive()">Mark Arrived at Pickup</button>
            <button id="btnStart" class="btn-yellow" style="display: none;" onclick="driverStart()">Start Trip (Verify OTP)</button>
            <button id="btnComplete" class="btn-red" style="display: none;" onclick="driverComplete()">Complete Trip at Dropoff</button>
        </div>

        <div class="card" style="flex: 1;">
            <div class="card-title">Live WebSocket Feed</div>
            <div id="logBox" class="log-box">Ready to request ride...</div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([40.7580, -73.9855], 14);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, TomTom'
        }).addTo(map);

        let pickupMarker = null;
        let dropoffMarker = null;
        let vehicleMarker = null;
        let streetRouteLine = null;
        let activeSocket = null;

        let currentRideId = null;
        let currentDriverId = null;
        let currentOtp = null;

        function log(msg) {
            const box = document.getElementById('logBox');
            const time = new Date().toLocaleTimeString();
            box.innerHTML = `[${time}] ${msg}<br/>` + box.innerHTML;
        }

        function setStatus(status) {
            const badge = document.getElementById('statusBadge');
            badge.className = `status-badge status-${status.toLowerCase()}`;
            badge.innerText = status.replace('_', ' ');
        }

        async function requestRide() {
            const riderId = document.getElementById('riderId').value.trim();
            const [pLat, pLon] = document.getElementById('pickupCoords').value.split(',').map(s => parseFloat(s.trim()));
            const [dLat, dLon] = document.getElementById('dropoffCoords').value.split(',').map(s => parseFloat(s.trim()));

            if (pickupMarker) map.removeLayer(pickupMarker);
            if (dropoffMarker) map.removeLayer(dropoffMarker);
            if (streetRouteLine) map.removeLayer(streetRouteLine);
            if (vehicleMarker) { map.removeLayer(vehicleMarker); vehicleMarker = null; }

            document.getElementById('otpContainer').style.display = 'none';
            document.getElementById('receiptContainer').style.display = 'none';
            document.getElementById('routeInfoBox').style.display = 'none';

            pickupMarker = L.marker([pLat, pLon]).addTo(map).bindPopup('<b>📍 Pickup</b>').openPopup();
            dropoffMarker = L.marker([dLat, dLon]).addTo(map).bindPopup('<b>🏁 Dropoff</b>');

            document.getElementById('btnRequest').disabled = true;
            log('Requesting ride with OSRM street-network routing...');

            try {
                const response = await fetch('/api/v1/rides/request/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        rider_id: riderId,
                        pickup_latitude: pLat,
                        pickup_longitude: pLon,
                        dropoff_latitude: dLat,
                        dropoff_longitude: dLon
                    })
                });
                const data = await response.json();

                if (!response.ok) {
                    log('Error creating ride: ' + JSON.stringify(data));
                    document.getElementById('btnRequest').disabled = false;
                    return;
                }

                currentRideId = data.id;
                currentDriverId = data.target_driver;

                // Render Street-Snapped Polyline from OSRM
                if (data.route_geojson && data.route_geojson.length > 0) {
                    streetRouteLine = L.polyline(data.route_geojson, {
                        color: '#0284c7',
                        weight: 6,
                        opacity: 0.9,
                        lineCap: 'round',
                        lineJoin: 'round'
                    }).addTo(map);
                    map.fitBounds(streetRouteLine.getBounds(), { padding: [60, 60] });
                }

                // Show Driving Distance & Duration
                if (data.distance_km && data.estimated_duration_minutes) {
                    document.getElementById('routeInfoBox').style.display = 'flex';
                    document.getElementById('routeDistance').innerText = `🛣️ ${data.distance_km} km`;
                    document.getElementById('routeDuration').innerText = `⏱️ ${data.estimated_duration_minutes} mins ETA`;
                }

                log(`Ride created! Distance: ${data.distance_km}km, ETA: ${data.estimated_duration_minutes} mins.`);
                setStatus(data.status);

                // Show Driver Actions Card
                document.getElementById('driverActionsCard').style.display = 'flex';
                document.getElementById('btnAccept').style.display = 'block';
                document.getElementById('btnArrive').style.display = 'none';
                document.getElementById('btnStart').style.display = 'none';
                document.getElementById('btnComplete').style.display = 'none';

                connectWebSocket(data.id);
            } catch (err) {
                log('Network error: ' + err.message);
                document.getElementById('btnRequest').disabled = false;
            }
        }

        async function driverAccept() {
            log('Driver accepting offer...');
            const res = await fetch('/api/v1/rides/offer-response/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ride_id: currentRideId, driver_id: currentDriverId, action: 'accept' })
            });
            const data = await res.json();
            currentOtp = data.otp;

            document.getElementById('btnAccept').style.display = 'none';
            document.getElementById('btnArrive').style.display = 'block';
        }

        async function driverArrive() {
            log('Driver marked arrived at pickup...');
            await fetch('/api/v1/rides/arrived/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ride_id: currentRideId, driver_id: currentDriverId })
            });
            document.getElementById('btnArrive').style.display = 'none';
            document.getElementById('btnStart').style.display = 'block';
        }

        async function driverStart() {
            log(`Driver verifying OTP ${currentOtp} and starting trip...`);
            await fetch('/api/v1/rides/start-trip/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ride_id: currentRideId, driver_id: currentDriverId, otp: currentOtp })
            });
            document.getElementById('btnStart').style.display = 'none';
            document.getElementById('btnComplete').style.display = 'block';
        }

        async function driverComplete() {
            log('Driver completing trip at destination...');
            await fetch('/api/v1/rides/complete-trip/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ride_id: currentRideId, driver_id: currentDriverId })
            });
            document.getElementById('btnComplete').style.display = 'none';
            document.getElementById('driverActionsCard').style.display = 'none';
        }

        function connectWebSocket(rideId) {
            if (activeSocket) activeSocket.close();

            const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            const wsUrl = `${protocol}${window.location.host}/ws/rides/${rideId}/`;
            log(`Connecting WebSocket: ${wsUrl}`);

            activeSocket = new WebSocket(wsUrl);

            activeSocket.onopen = () => { log('WebSocket connected. Live tracking active.'); };
            activeSocket.onmessage = (event) => { handleStreamEvent(JSON.parse(event.data)); };
            activeSocket.onerror = () => { log('WebSocket error.'); };
            activeSocket.onclose = () => { log('WebSocket closed.'); };
        }

        function handleStreamEvent(msg) {
            switch(msg.type) {
                case 'connection_established':
                    log(msg.message);
                    break;

                case 'driver_accepted':
                    setStatus('ACCEPTED');
                    document.getElementById('otpContainer').style.display = 'block';
                    document.getElementById('otpValue').innerText = msg.otp;
                    log(`Driver accepted! Security OTP: ${msg.otp}`);
                    break;

                case 'driver_location':
                    updateVehiclePosition(msg.latitude, msg.longitude);
                    break;

                case 'driver_arrived':
                    setStatus('ARRIVED');
                    log(msg.message);
                    break;

                case 'trip_started':
                    setStatus('IN_PROGRESS');
                    log(msg.message);
                    break;

                case 'trip_completed':
                    setStatus('COMPLETED');
                    document.getElementById('receiptContainer').style.display = 'block';
                    document.getElementById('receiptDetails').innerText = `${msg.distance_km} km • $${msg.fare_amount.toFixed(2)}`;
                    log(msg.message);
                    document.getElementById('btnRequest').disabled = false;
                    break;

                default:
                    log(JSON.stringify(msg));
            }
        }

        function updateVehiclePosition(lat, lon) {
            if (!vehicleMarker) {
                const carIcon = L.divIcon({
                    className: 'car-marker',
                    html: '🚗',
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });
                vehicleMarker = L.marker([lat, lon], { icon: carIcon }).addTo(map);
                log(`Car marker placed at (${lat.toFixed(4)}, ${lon.toFixed(4)})`);
            } else {
                vehicleMarker.setLatLng([lat, lon]);
            }
        }
    </script>
</body>
</html>
